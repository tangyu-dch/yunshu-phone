name: Yunshu Phone Wails Build

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS Client (app, dmg, pkg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (macOS)
        run: |
          brew install pjproject portaudio speex openssl@3 pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Make static wrapper executable
        run: chmod +x build/pkg-config-static.sh

      - name: Install Frontend Dependencies
        run: make install-deps

      - name: Build macOS Application and Packages
        run: make build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-phone-macos-dmg
          path: build/bin/云枢.dmg
          if-no-files-found: error

      - name: Upload macOS PKG
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-phone-macos-pkg
          path: build/bin/云枢.pkg
          if-no-files-found: error

  build-windows:
    name: Build Windows Client
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Cache PJSIP
        id: cache-pjsip
        uses: actions/cache@v4
        with:
          path: C:/pjsip-install
          key: ${{ runner.os }}-pjsip-v2.14-v4

      - name: Build PJSIP from source (if not cached)
        if: steps.cache-pjsip.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 --branch 2.14 https://github.com/pjsip/pjproject.git
          cd pjproject
          ./configure --prefix=/C/pjsip-install --host=x86_64-w64-mingw32 --build=x86_64-w64-mingw32 --disable-video --disable-libyuv --disable-sound
          make dep
          make -j4
          make install

      - name: Install Wails CLI
        shell: msys2 {0}
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Install Frontend Dependencies
        shell: msys2 {0}
        run: |
          cd frontend
          npm ci

      - name: Build Windows Application and Installer
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="/C/pjsip-install/lib/pkgconfig:/mingw64/lib/pkgconfig"
          export PKG_CONFIG=$(cygpath -w "$(pwd)/build/pkg-config-static.bat")
          wails build -platform windows/amd64 -nsis

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-phone-windows-installer
          path: build/bin/云枢-amd64-installer.exe
          if-no-files-found: error

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-phone-windows-exe
          path: build/bin/云枢.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux Client (AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install System Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libpjproject-dev portaudio19-dev libspeex-dev libssl-dev pkg-config wget

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Make scripts executable
        run: |
          chmod +x build/pkg-config-static.sh
          chmod +x build/package_appimage.sh

      - name: Install Frontend Dependencies
        run: make install-deps

      - name: Build Linux Application
        run: |
          export PKG_CONFIG="$(pwd)/build/pkg-config-static.sh"
          wails build -platform linux/amd64

      - name: Package Linux AppImage
        run: ./build/package_appimage.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: yunshu-phone-linux-appimage
          path: build/bin/云枢-x86_64.AppImage
          if-no-files-found: error
